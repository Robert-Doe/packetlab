# Module 15 -- a real Logstash pipeline that ingests Module 14's exact
# conn.log format (tab-separated Zeek fields) and the alerts.jsonl this
# module's own log_shipper.py produces, and indexes both into
# Elasticsearch, tagged so Kibana/Grafana can distinguish them.

input {
  file {
    path => "/data/conn.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"   # re-read the whole file every restart -- fine for a lab, never do this in production
    type => "zeek_conn"
  }
  file {
    path => "/data/alerts.jsonl"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json_lines"
    type => "ids_alert"
  }
}

filter {
  if [type] == "zeek_conn" {
    # Skip Zeek's own #fields/#separator header lines
    if [message] =~ /^#/ {
      drop {}
    }

    dissect {
      mapping => {
        "message" => "%{ts}\t%{uid}\t%{orig_h}\t%{orig_p}\t%{resp_h}\t%{resp_p}\t%{proto}\t%{service}\t%{duration}\t%{orig_bytes}\t%{resp_bytes}"
      }
    }

    mutate {
      convert => {
        "ts" => "float"
        "orig_p" => "integer"
        "resp_p" => "integer"
        "duration" => "float"
        "orig_bytes" => "integer"
        "resp_bytes" => "integer"
      }
    }

    date {
      match => ["ts", "UNIX"]
      target => "@timestamp"
    }
  }

  if [type] == "ids_alert" {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  if [type] == "zeek_conn" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "module15-conn-%{+YYYY.MM.dd}"
    }
  }
  if [type] == "ids_alert" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "module15-alerts-%{+YYYY.MM.dd}"
    }
  }
  stdout { codec => rubydebug }   # so you can watch documents flow in the container logs
}
